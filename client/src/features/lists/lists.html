@if (paginatedMembers(); as paginatedResult) {
  <div class="flex flex-col w-full">
    <div class="flex justify-between">
      <div class="tabs tabs-box tabs-lg text-primary w-fit">
        @for (tab of tabs; track $index) {
          <button
            role="tab"
            class="tab"
            [class.tab-active]="likesParams.predicate === tab.predicate"
            (click)="setPredicate(tab.predicate)"
          >
            {{ tab.label }}
          </button>
        }
      </div>
      <div class="flex justify-between items-center">
        @if (paginatedResult.metadata; as metadata) {
          <app-paginator
            [hidden]="metadata.totalCount === 0"
            [pageNumber]="metadata.currentPage"
            [totalCount]="metadata.totalCount"
            [pageSize]="metadata.pageSize"
            [totalPages]="metadata.totalPages"
            (pageChange)="onPageChange($event)"
          ></app-paginator>
        }
      </div>
    </div>
    @if (paginatedResult.items; as members) {
      <div class="grid grid-cols-5 gap-6">
        @for (member of members; track member.id) {
          <app-member-card [member]="member"></app-member-card>
        }
      </div>
    } @else {
      <p class="pt-4">No members found.</p>
    }
  </div>
}
